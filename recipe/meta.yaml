{% set name = "khiops" %}
{% set version = "11.0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/2f/8b/2326a8d6c608e41041d9b9ef2759b50c580d60351b03a5d8d788e53f41be/{{ name }}-{{ version }}.tar.gz
  sha256: c7d07a23f388fd09d0ebcc76d19ff6bdbd5260f28c09ca5193e3fe0aa609430b

build:
  entry_points:
    - kh-status=khiops.tools:kh_status_entry_point
    - kh-samples=khiops.tools:kh_samples_entry_point
    - kh-download-datasets=khiops.tools:kh_download_datasets_entry_point
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir --no-build-isolation -vvv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - khiops-core =11.0.1
    - pandas >=2.3.3,<4.0.0
    - scikit-learn >=1.7.2,<1.9.0
  run_constrained:
    # do not necessary use the latest version
    # to avoid undesired breaking changes
    - boto3 >=1.17.39,<=1.35.69
    - google-cloud-storage >=1.37.0

test:
  imports:
    - khiops
  commands:
    - kh-status
    - kh-samples --help
    - kh-download-datasets --help
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://khiops.org
  summary: Python library for the Khiops AutoML suite
  license: BSD-3-Clause
  license_file: LICENSE.md
  doc_url: https://khiops.org
  dev_url: https://github.com/khiopsml/khiops-python

extra:
  recipe-maintainers:
    - popescu-v
    - tramora
    - bruno-at-orange
